<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환불 정책 | 콜센터만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .lang-btn { cursor: pointer; transition: color 0.2s; }
        .lang-btn.active { color: #2563eb; font-weight: 900; text-decoration: underline; }
        
        /* 내용 스타일 */
        .policy-content h3 { font-size: 1.25rem; font-weight: 700; margin-top: 2rem; margin-bottom: 0.75rem; color: #1e293b; }
        .policy-content p { margin-bottom: 1rem; line-height: 1.7; color: #475569; }
        .policy-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; color: #475569; }
        .policy-content li { margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 hover:opacity-80 transition">
                <i class="fa-solid fa-clock-rotate-left text-blue-600 text-2xl"></i>
                <span class="text-xl font-black text-slate-800 tracking-tighter" data-i18n="logo_text">콜센터만들기</span>
            </a>
            <div class="flex items-center space-x-6">
                <div class="text-sm font-bold text-slate-400 flex items-center space-x-2 border-r border-slate-300 pr-6 mr-2">
                    <button onclick="changeLanguage('ko')" id="btn-ko" class="lang-btn hover:text-slate-800">KR</button>
                    <span>|</span>
                    <button onclick="changeLanguage('en')" id="btn-en" class="lang-btn hover:text-slate-800">EN</button>
                </div>
                <a href="start.html" class="text-slate-600 font-bold hover:text-blue-600 transition text-sm hidden md:inline-block" data-i18n="nav_guide">사용 가이드</a>
                <a href="pricing.html" class="px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200" data-i18n="nav_pricing">이용권 충전</a>
            </div>
        </div>
    </nav>

    <!-- 본문 -->
    <main class="max-w-4xl mx-auto px-6 py-16">
        <div class="bg-white rounded-[2.5rem] border border-slate-200 p-8 md:p-12 shadow-sm">
            <div class="border-b border-slate-100 pb-8 mb-8">
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-4" data-i18n="refund_title">환불 정책</h1>
                <p class="text-slate-400 text-sm" data-i18n="last_updated">최종 수정일: 2026년 1월 12일</p>
            </div>
            <div class="policy-content" data-i18n="refund_body">
                <!-- JS 내용 주입 -->
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="py-16 bg-slate-50 border-t border-slate-200 text-center">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex justify-center space-x-8 mb-8 text-slate-400 text-xs font-bold uppercase tracking-widest">
                <a href="terms.html" class="hover:text-blue-600 transition">Terms</a>
                <a href="privacy.html" class="hover:text-blue-600 transition">Privacy</a>
                <a href="refund.html" class="text-blue-600 underline">Refund</a>
            </div>
            <div class="text-slate-400 text-xs space-y-2">
                <p>© 2026 <span data-i18n="logo_text">콜센터만들기</span>. All rights reserved.</p>
                <p>Contact: <a href="mailto:ilseoeng@gmail.com" class="hover:text-blue-600 underline">ilseoeng@gmail.com</a></p>
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            ko: {
                logo_text: "콜센터만들기",
                nav_guide: "사용 가이드",
                nav_pricing: "이용권 충전",
                refund_title: "환불 정책",
                last_updated: "최종 수정일: 2026년 1월 12일",
                refund_body: `
                    <h3>1. 14일 무조건 환불 보장 (Paddle 정책 준수)</h3>
                    <p>본 서비스는 글로벌 결제 대행사 Paddle의 이용 약관을 준수합니다. <strong>구매일로부터 14일 이내에 환불을 요청하시는 경우, 서비스 이용 여부나 사유와 관계없이 조건 없이 전액 환불해 드립니다.</strong></p>
                    <p>단순 변심을 포함한 어떠한 경우에도 14일 이내라면 환불이 보장됩니다.</p>
                    
                    <h3>2. 14일 경과 후 환불 규정</h3>
                    <p>구매일로부터 14일이 지난 이후에는 원칙적으로 환불이 불가능합니다. 단, 서비스의 치명적인 기술적 오류로 인해 사용이 불가능했던 사실이 소명되는 경우 등 예외적인 상황에서는 회사의 재량에 따라 검토될 수 있습니다.</p>

                    <h3>3. 환불 요청 절차</h3>
                    <p>환불을 원하시는 경우, 아래 내용을 포함하여 [ilseoeng@gmail.com]으로 메일을 보내주세요.</p>
                    <ul>
                        <li>구매 시 사용한 이메일 주소</li>
                        <li>Paddle 주문 번호 (영수증에 기재됨)</li>
                    </ul>
                    <p>요청이 접수되면 영업일 기준 3~5일 이내에 승인 및 취소 처리가 완료됩니다.</p>
                `
            },
            en: {
                logo_text: "Call Center Maker",
                nav_guide: "User Guide",
                nav_pricing: "Pricing",
                refund_title: "Refund Policy",
                last_updated: "Last Updated: January 12, 2026",
                refund_body: `
                    <h3>1. 14-Day Money-Back Guarantee (Paddle Compliant)</h3>
                    <p>We comply with the refund policy of our global payment provider, Paddle. <strong>If you request a refund within 14 days of purchase, we will issue a full refund without any conditions or exceptions, regardless of whether you used the service.</strong></p>
                    <p>This "No Questions Asked" policy applies to all reasons, including simple change of mind.</p>
                    
                    <h3>2. Refunds After 14 Days</h3>
                    <p>Refunds are generally not available after 14 days from the date of purchase. However, exceptions may be considered at the Company's discretion in cases where the service was unusable due to critical technical errors.</p>

                    <h3>3. How to Request a Refund</h3>
                    <p>To request a refund, please email [ilseoeng@gmail.com] with the following information:</p>
                    <ul>
                        <li>Email address used for purchase</li>
                        <li>Paddle Order ID (found on your receipt)</li>
                    </ul>
                    <p>Once received, the refund will be processed within 3-5 business days.</p>
                `
            }
        };

        function changeLanguage(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
            document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
            document.getElementById('btn-ko').classList.toggle('text-slate-400', lang !== 'ko');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-en').classList.toggle('text-slate-400', lang !== 'en');
            localStorage.setItem('preferredLang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang');
            const userLang = navigator.language || navigator.userLanguage;
            const defaultLang = savedLang || (userLang.startsWith('ko') ? 'ko' : 'en');
            changeLanguage(defaultLang);
        });
    </script>
</body>
</html>
