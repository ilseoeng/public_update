<!DOCTYPE html>
<html lang="ko">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .lang-btn { cursor: pointer; transition: color 0.2s; }
        .lang-btn.active { color: #2563eb; font-weight: 900; text-decoration: underline; }
        
        /* 약관 내용 스타일 */
        .terms-content h3 { font-size: 1.25rem; font-weight: 700; margin-top: 2rem; margin-bottom: 0.75rem; color: #1e293b; }
        .terms-content p { margin-bottom: 1rem; line-height: 1.7; color: #475569; }
        .terms-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; color: #475569; }
        .terms-content li { margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <!-- 1. 상단 네비게이션 (공통) -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- 좌측: 로고 -->
            <a href="index.html" class="flex items-center space-x-2 hover:opacity-80 transition">
                <i class="fa-solid fa-clock-rotate-left text-blue-600 text-2xl"></i>
                <span class="text-xl font-black text-slate-800 tracking-tighter" data-i18n="logo_text">콜센터만들기</span>
            </a>
            
            <!-- 우측: 메뉴 -->
            <div class="flex items-center space-x-6">
                <!-- 언어 변경 버튼 -->
                <div class="text-sm font-bold text-slate-400 flex items-center space-x-2 border-r border-slate-300 pr-6 mr-2">
                    <button onclick="changeLanguage('ko')" id="btn-ko" class="lang-btn hover:text-slate-800">KR</button>
                    <span>|</span>
                    <button onclick="changeLanguage('en')" id="btn-en" class="lang-btn hover:text-slate-800">EN</button>
                </div>

                <!-- 사용 가이드 -->
                <a href="start.html" class="text-slate-600 font-bold hover:text-blue-600 transition text-sm hidden md:inline-block" data-i18n="nav_guide">
                    사용 가이드
                </a>
                <!-- 이용권 충전 -->
                <a href="pricing.html" class="px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200" data-i18n="nav_pricing">
                    이용권 충전
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. 본문 (이용약관) -->
    <main class="max-w-4xl mx-auto px-6 py-16">
        <div class="bg-white rounded-[2.5rem] border border-slate-200 p-8 md:p-12 shadow-sm">
            <div class="border-b border-slate-100 pb-8 mb-8">
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-4" data-i18n="terms_title">이용약관</h1>
                <p class="text-slate-400 text-sm" data-i18n="last_updated">최종 수정일: 2026년 1월 12일</p>
            </div>

            <!-- 약관 내용이 들어갈 곳 -->
            <div class="terms-content" data-i18n="terms_body">
                <!-- JS에서 내용이 주입됩니다 -->
            </div>
        </div>
    </main>

    <!-- 3. 푸터 -->
    <footer class="py-16 bg-slate-50 border-t border-slate-200 text-center">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex justify-center space-x-8 mb-8 text-slate-400 text-xs font-bold uppercase tracking-widest">
                <a href="terms.html" class="text-blue-600 underline">Terms</a>
                <a href="privacy.html" class="hover:text-blue-600 transition">Privacy</a>
                <a href="refund.html" class="hover:text-blue-600 transition">Refund</a>
            </div>
            <div class="text-slate-400 text-xs space-y-2">
                <p>© 2026 <span data-i18n="logo_text">콜센터만들기</span>. All rights reserved.</p>
                <p>Contact: <a href="mailto:ilseoeng@gmail.com" class="hover:text-blue-600 underline">ilseoeng@gmail.com</a></p>
            </div>
        </div>
    </footer>

    <!-- 다국어 스크립트 -->
    <script>
        const translations = {
            ko: {
                logo_text: "콜센터만들기",
                nav_guide: "사용 가이드",
                nav_pricing: "이용권 충전",
                terms_title: "이용약관",
                last_updated: "최종 수정일: 2026년 1월 12일",
                terms_body: `
                    <h3>제1조 (목적)</h3>
                    <p>본 약관은 '콜센터만들기'(이하 "서비스")가 제공하는 PC 프로그램 및 모바일 앱 서비스의 이용과 관련하여 회사와 회원의 권리, 의무 및 책임사항을 규정함을 목적으로 합니다.</p>
                    
                    <h3>제2조 (서비스의 정의)</h3>
                    <p>"서비스"란 회원이 스마트폰과 PC를 연동하여 통화 기록 관리, 녹음 파일 전송, AI 요약 등의 기능을 이용할 수 있도록 제공하는 제반 시스템을 의미합니다.</p>
                    
                    <h3>제3조 (회원의 의무)</h3>
                    <ul>
                        <li>회원은 서비스를 이용함에 있어 관계 법령 및 본 약관을 준수해야 합니다.</li>
                        <li>타인의 개인정보를 도용하거나 불법적인 목적으로 서비스를 이용해서는 안 됩니다.</li>
                        <li>서비스 이용 시 발생하는 데이터 요금은 회원이 부담합니다.</li>
                    </ul>

                    <h3>제4조 (결제 및 환불)</h3>
                    <p>본 서비스의 유료 결제는 글로벌 결제 대행사(Paddle)를 통해 이루어집니다. 결제 후 사용 내역이 없는 경우 7일 이내 환불이 가능하며, 이미 사용한 이용권에 대해서는 환불이 제한될 수 있습니다.</p>

                    <h3>제5조 (책임의 한계)</h3>
                    <p>회사는 천재지변, 서버 장애 또는 회원의 귀책사유로 인한 서비스 이용 장애에 대하여 책임을 지지 않습니다. 또한, 회원이 서비스에 저장한 데이터의 유실에 대비하여 회원은 별도로 중요 데이터를 백업해야 합니다.</p>
                `
            },
            en: {
                logo_text: "Call Center Maker",
                nav_guide: "User Guide",
                nav_pricing: "Pricing",
                terms_title: "Terms of Service",
                last_updated: "Last Updated: January 12, 2026",
                terms_body: `
                    <h3>Article 1 (Purpose)</h3>
                    <p>These Terms of Service aim to define the rights, obligations, and responsibilities of the company and members regarding the use of the PC program and mobile app services provided by 'Call Center Maker' (hereinafter referred to as the "Service").</p>
                    
                    <h3>Article 2 (Definition of Service)</h3>
                    <p>"Service" refers to the system that allows members to connect their smartphones and PCs to use features such as call log management, recording file transfer, and AI summary.</p>
                    
                    <h3>Article 3 (Member Obligations)</h3>
                    <ul>
                        <li>Members must comply with relevant laws and these Terms when using the Service.</li>
                        <li>Members must not steal others' personal information or use the Service for illegal purposes.</li>
                        <li>Data charges incurred while using the Service are the responsibility of the member.</li>
                    </ul>

                    <h3>Article 4 (Payment and Refund)</h3>
                    <p>Paid services are processed through a global payment gateway (Paddle). Refunds are available within 7 days if there is no usage history after payment. Refunds may be restricted for vouchers that have already been used.</p>

                    <h3>Article 5 (Limitation of Liability)</h3>
                    <p>The Company is not responsible for service interruptions caused by natural disasters, server failures, or member's fault. In addition, members should back up important data separately in preparation for potential data loss.</p>
                `
            }
        };

        function changeLanguage(lang) {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });

            document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
            document.getElementById('btn-ko').classList.toggle('text-slate-400', lang !== 'ko');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-en').classList.toggle('text-slate-400', lang !== 'en');

            localStorage.setItem('preferredLang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang');
            const userLang = navigator.language || navigator.userLanguage;
            const defaultLang = savedLang || (userLang.startsWith('ko') ? 'ko' : 'en');
            changeLanguage(defaultLang);
        });
    </script>

</body>
</html>
