<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용권 충전 센터 | 콜센터만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .lang-btn { cursor: pointer; transition: all 0.2s; color: #94a3b8; font-weight: 700; }
        .lang-btn.active { color: #2563eb !important; font-weight: 900; text-decoration: underline; text-underline-offset: 4px; }
        @media (max-width: 768px) {
            .pricing-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-left: 10vw; padding-right: 10vw; }
            .pricing-card { width: 80vw; flex-shrink: 0; scroll-snap-align: center; margin-right: 15px; }
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-1.5 hover:opacity-80 transition shrink-0">
                <i class="fa-solid fa-clock-rotate-left text-blue-600 text-xl md:text-2xl"></i>
                <span class="text-lg md:text-xl font-black text-slate-800 tracking-tighter" data-i18n="logo_text">콜센터만들기</span>
            </a>
            <div class="flex items-center space-x-2 md:space-x-6">
                <div class="flex items-center space-x-1.5 text-[11px] md:text-sm border-slate-300 md:border-r md:pr-6">
                    <button onclick="changeLanguage('ko')" id="btn-ko" class="lang-btn">KR</button>
                    <span class="text-slate-200">|</span>
                    <button onclick="changeLanguage('en')" id="btn-en" class="lang-btn">EN</button>
                </div>
                <a href="pricing.html" class="px-3 py-2 md:px-5 md:py-2.5 bg-blue-600 text-white rounded-full text-[11px] md:text-sm font-black hover:bg-blue-700 shadow-lg" data-i18n="nav_pricing">이용권 충전</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-0 md:px-6 py-8 md:py-12">
        <section id="authSection" class="bg-white rounded-[2rem] shadow-xl border p-6 md:p-10 mb-12 max-w-lg mx-auto mx-4">
            <div class="text-center mb-8">
                <h2 class="text-xl font-black text-slate-900 mb-2" data-i18n="auth_title">1. 기기 정보 인증</h2>
                <p class="text-slate-400 text-xs" data-i18n="auth_desc">원격 코드와 비밀번호를 입력해주세요.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="remoteCode" placeholder="예: vm6 292" class="w-full px-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-xl text-center text-2xl font-black text-blue-600 outline-none uppercase">
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-xl text-center text-xl font-bold outline-none">
                <div class="flex justify-center py-2">
                    <div class="g-recaptcha" data-sitekey="6LfgnEQsAAAAABjeS4ssb-FvLMDSun59SrBFjaZP"></div>
                </div>
                <button onclick="verifyDevice()" id="verifyBtn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-lg hover:bg-blue-700 shadow-lg" data-i18n="btn_verify">인증하기</button>
            </div>
            <p id="statusMsg" class="mt-6 text-[11px] font-bold text-center text-slate-300" data-i18n="status_wait">인증 완료 후 충전 시간을 선택할 수 있습니다.</p>
        </section>

        <div id="pricingSection">
            <div id="pricingSlider" class="pricing-container no-scrollbar md:grid md:grid-cols-3 md:gap-6 pb-10">
                <div class="pricing-card bg-white rounded-[2rem] p-8 border shadow-sm flex flex-col items-center">
                    <h3 class="text-xl font-black" data-i18n="p30_title">30분</h3>
                    <div class="text-3xl font-black text-slate-800 my-6" data-i18n="p30_price">₩3,000</div>
                    <button onclick="pay('30min')" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black" data-i18n="btn_buy">구매하기</button>
                </div>
                <div class="pricing-card bg-white rounded-[2rem] p-8 border-4 border-blue-500 shadow-2xl flex flex-col items-center">
                    <h3 class="text-xl font-black" data-i18n="p60_title">60분</h3>
                    <div class="text-3xl font-black text-blue-600 my-6" data-i18n="p60_price">₩5,000</div>
                    <button onclick="pay('1hour')" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black" data-i18n="btn_buy">구매하기</button>
                </div>
                <div class="pricing-card bg-white rounded-[2rem] p-8 border shadow-sm flex flex-col items-center">
                    <h3 class="text-xl font-black" data-i18n="p180_title">180분</h3>
                    <div class="text-3xl font-black text-slate-800 my-6" data-i18n="p180_price">₩12,000</div>
                    <button onclick="pay('3hours')" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black" data-i18n="btn_buy">구매하기</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsdo-gps3z3nvwJ_EjNe0e4ZI4s4QH7XM",
            projectId: "gen-lang-client-0349319821",
            authDomain: "gen-lang-client-0349319821.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (typeof Paddle !== 'undefined') {
            Paddle.Environment.set('sandbox');
            Paddle.Initialize({ token: 'test_d786258e7de5e845de5554e2ef2' });
        }

        window.isDeviceVerified = false;
        window.currentLang = 'ko'; 
        
        window.translations = {
            ko: {
                logo_text: "콜센터만들기", nav_pricing: "이용권 충전",
                auth_title: "1. 기기 정보 인증", auth_desc: "원격 코드와 비밀번호를 입력해주세요.",
                btn_verify: "인증하기", status_wait: "인증 완료 후 충전 시간을 선택할 수 있습니다.",
                status_ok: "✅ 인증 완료! 이용권을 선택해 주세요.",
                p30_title: "30분", p30_price: "₩3,000", p60_title: "60분", p60_price: "₩5,000", p180_title: "180분", p180_price: "₩12,000",
                btn_buy: "구매하기", msg_verify_first: "⚠️ 결제를 진행하려면 먼저 상단에서 [기기 인증]을 완료해주세요."
            },
            en: {
                logo_text: "Call Center Maker", nav_pricing: "Pricing",
                auth_title: "1. Device Verification", auth_desc: "Please enter your Remote Code and Password.",
                btn_verify: "Verify", status_wait: "You can select a plan after verification.",
                status_ok: "✅ Verified! Please select a plan.",
                p30_title: "30 Mins", p30_price: "$3.00", p60_title: "60 Mins", p60_price: "$5.00", p180_title: "180 Mins", p180_price: "$12.00",
                btn_buy: "Buy Now", msg_verify_first: "⚠️ Please complete [Device Verification] first."
            }
        };

        window.changeLanguage = (lang) => {
            window.currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (window.translations[lang][key]) el.innerHTML = window.translations[lang][key];
            });
            document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            localStorage.setItem('preferredLang', lang);
        };

        window.verifyDevice = async (isAuto = false) => {
            // isAuto가 true면 캡차 검사를 건너뜀
            if (!isAuto && typeof grecaptcha !== "undefined") {
                if (grecaptcha.getResponse().length === 0) { alert("reCAPTCHA 인증이 필요합니다."); return; }
            }

            const codeInput = document.getElementById('remoteCode');
            const pwInput = document.getElementById('password');
            let rawCode = codeInput.value.trim().toLowerCase();
            const password = pwInput.value.trim();
            
            if (rawCode.length === 6 && !rawCode.includes(" ")) rawCode = rawCode.substring(0, 3) + " " + rawCode.substring(3);
            if (!rawCode || !password) return;

            try {
                const q = query(collection(db, "devices"), where("serial_code", "==", rawCode), where("password", "==", password));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    window.isDeviceVerified = true;
                    if (!isAuto) alert("인증 성공!"); 
                    
                    document.getElementById('statusMsg').innerHTML = window.translations[window.currentLang].status_ok;
                    setTimeout(() => {
                        document.getElementById('pricingSection').scrollIntoView({ behavior: 'smooth' });
                    }, 500);
                } else { 
                    // 자동 시도였다가 실패하면 캡차를 다시 보여줄 수도 있음 (선택사항)
                    alert("인증 실패! 코드와 비밀번호를 확인해주세요."); 
                }
            } catch (e) { 
                console.error(e);
                alert("인증 오류: " + e.message); 
            }
        };

        window.pay = (plan) => {
            if (!window.isDeviceVerified) {
                alert(window.translations[window.currentLang].msg_verify_first);
                document.getElementById('authSection').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            const machine_id = document.getElementById('remoteCode').value;
            let pId = "";
            if (window.currentLang === 'ko') {
                if (plan === '30min') pId = "pri_01kf2ej2vz3rd54k9zhewxba8m"; 
                else if (plan === '1hour') pId = "pri_01kf2ekn8da5k779rfaqzpah83";
                else if (plan === '3hours') pId = "pri_01kf2emynse3p9kfcjez5n4vvg";
            } else {
                if (plan === '30min') pId = "pri_01kf2f4ng3x56svqw9f320nx4p"; 
                else if (plan === '1hour') pId = "pri_01kf2f6c18s5e2w0cjfbj95j5x";
                else if (plan === '3hours') pId = "pri_01kf2f788ebpq41mhf0zjxrh18";
            }
            Paddle.Checkout.open({
                settings: { displayMode: "overlay", theme: "light", locale: window.currentLang === 'ko' ? "ko" : "en" },
                items: [{ priceId: pId, quantity: 1 }],
                customData: { machine_id: machine_id }
            });
        };

        // ★ 시간 제한 검사 로직 적용
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
            window.changeLanguage(savedLang);

            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            const pwParam = urlParams.get('pw');
            const tParam = urlParams.get('t'); // 시간 토큰 가져오기

            if (codeParam) document.getElementById('remoteCode').value = codeParam;
            if (pwParam) document.getElementById('password').value = pwParam;

            if (codeParam && pwParam && tParam) {
                // 1. 현재 시간(밀리초)
                const now = Date.now();
                // 2. URL에 있는 시간
                const requestTime = parseInt(tParam);

                // 3. 시간 차이 계산 (3분 = 180,000 밀리초)
                // 미래의 시간(서버 시간차 고려)이거나, 과거 3분 이내라면 통과
                if (!isNaN(requestTime) && Math.abs(now - requestTime) < 180000) {
                    
                    // 캡차 숨기기
                    const captchaContainer = document.querySelector('.g-recaptcha').parentNode; 
                    if (captchaContainer) captchaContainer.style.display = 'none';

                    // 자동 인증 실행
                    setTimeout(() => verifyDevice(true), 500);

                } else {
                    console.log("링크 유효기간 만료 또는 잘못된 접근");
                    // 유효기간 지났으므로 캡차 숨기지 않음 & 자동 인증 안 함
                }
            }
        });
    </script>
</body>
</html>
